name: Playground dependency contracts
on:
  pull_request:
    paths: ['playground/**', 'playground.nix', '.github/workflows/playground-dependencies.yml']
  push:
    branches: [main]
    paths: ['playground/**', 'playground.nix', '.github/workflows/playground-dependencies.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
      - run: npm run test:dependencies
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix-build -A packages.playground
